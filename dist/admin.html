<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Maha Duck — Order Dashboard</title>
    <meta name="theme-color" content="#0c3a20" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin">
    <!-- Login -->
    <section class="login" id="loginView" hidden>
      <form class="login-card" id="loginForm">
        <img src="images/mascot/duck-welcome.webp" alt="" class="login-duck" />
        <div class="login-brand"><img src="images/brand/logo-mark.png" alt="" width="36" /><div><strong>MAHA DUCK</strong><small data-i18n="dash">Order Dashboard</small></div></div>
        <h1 data-i18n="login">Staff login</h1>
        <label class="field"><span data-i18n="email">Email</span><input name="email" type="email" autocomplete="username" required /></label>
        <label class="field"><span data-i18n="password">Password</span><input name="password" type="password" autocomplete="current-password" required /></label>
        <p class="form-error" id="loginError" role="alert"></p>
        <button class="btn btn-red btn-lg" type="submit" data-i18n="signIn" style="width:100%">Sign in</button>
        <div class="lang lang-dark" role="group" aria-label="Language">
          <button type="button" data-lang="my">မြန်မာ</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="th">ไทย</button>
        </div>
      </form>
    </section>

    <!-- Dashboard -->
    <div id="dashView" hidden>
      <header class="topbar admin-top">
        <a class="brand" href="index.html" target="_blank" rel="noopener">
          <img class="brand-mark" src="images/brand/logo-mark.png" alt="" />
          <span class="brand-text"><strong>MAHA DUCK</strong><small data-i18n="dash">ORDER DASHBOARD</small></span>
        </a>
        <div class="admin-actions">
          <label class="switch" title="Accepting orders">
            <input type="checkbox" id="acceptToggle" />
            <span class="track"><span class="thumb"></span></span>
            <span class="switch-label" id="acceptLabel"></span>
          </label>
          <button class="icon-btn dark" type="button" id="printBtn" aria-pressed="false" title="Auto-print"></button>
          <button class="icon-btn dark" type="button" id="soundBtn" aria-pressed="true" title="Sound"></button>
          <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="my">မြန်မာ</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="th">ไทย</button>
          </div>
          <button class="btn btn-sm btn-ghost-light" type="button" id="signOut" data-i18n="signOut">Sign out</button>
        </div>
      </header>
      <div class="notice" id="demoBanner" hidden></div>

      <nav class="admin-tabs" role="tablist">
        <button type="button" role="tab" data-view="customer" aria-selected="false">Customer</button>
        <button type="button" role="tab" data-view="counter" aria-selected="true">Counter</button>
        <button type="button" role="tab" data-view="kitchen" aria-selected="false">Kitchen</button>
        <button type="button" role="tab" data-view="pos" aria-selected="false" data-i18n="pos">POS</button>
        <button type="button" role="tab" data-view="tables" aria-selected="false" data-i18n="tables">Table QR</button>
      </nav>

      <main class="admin-main" id="customerView" hidden>
        <section class="stats" id="customerStats"></section>
        <div class="toolbar">
          <div class="filters" id="customerFilters" role="tablist"></div>
        </div>
        <div class="board" id="customerBoard"></div>
      </main>

      <main class="admin-main" id="counterView">
        <section class="stats" id="stats"></section>

        <div class="toolbar">
          <div class="filters" id="filters" role="tablist"></div>
          <label class="range"><span data-i18n="range">Show</span>
            <select id="rangeSel"><option value="today" data-i18n="rToday">Today</option><option value="7" data-i18n="r7">7 days</option><option value="30" data-i18n="r30">30 days</option></select>
          </label>
        </div>

        <div class="board" id="board"></div>

        <details class="notice-box">
          <summary data-i18n="noticeLabel">Message to customers</summary>
          <div class="notice-row"><input id="noticeInput" maxlength="160" placeholder="e.g. Delivery takes ~45 min today" /><button class="btn btn-green btn-sm" type="button" id="noticeSave" data-i18n="save">Save</button></div>
        </details>
      </main>

      <main class="admin-main" id="kitchenView" hidden>
        <section class="stats" id="kitchenStats"></section>
        <div class="board kitchen-board" id="kitchenBoard"></div>
      </main>

      <main class="pos" id="posView" hidden>
        <section class="pos-menu">
          <div class="pos-cats" id="posCats" role="tablist"></div>
          <div class="pos-grid" id="posGrid"></div>
        </section>
        <aside class="pos-ticket" aria-label="Current sale">
          <div class="pos-ticket-head">
            <h2 data-i18n="posNew">New sale</h2>
            <button class="btn btn-sm btn-line" type="button" id="posClear" data-i18n="clearSale">Clear</button>
          </div>
          <div class="pos-type" id="posType" role="radiogroup"></div>
          <div class="pos-fields">
            <input id="posTable" inputmode="numeric" maxlength="8" placeholder="Table" aria-label="Table" />
            <input id="posName" maxlength="60" placeholder="Customer name (optional)" aria-label="Customer name" />
          </div>
          <div class="pos-lines" id="posLines"></div>
          <div class="pos-sum"><span data-i18n="total">Total</span><strong id="posTotal">฿0</strong></div>
          <div class="pos-pay">
            <button class="btn btn-green btn-lg" type="button" id="posCash" data-pay="cash">฿ Cash</button>
            <button class="btn btn-lg pp-btn" type="button" id="posPP" data-pay="promptpay">PromptPay QR</button>
          </div>
          <button class="btn btn-line" type="button" id="posLater" data-i18n="sendKitchen">Send to kitchen · pay later</button>
        </aside>
      </main>

      <main class="admin-main" id="tablesView" hidden>
        <div class="section-head"><h2 data-i18n="tablesTitle">QR codes for tables</h2><p data-i18n="tablesSub"></p></div>
        <div class="qr-controls">
          <label class="field"><span data-i18n="howMany">Number of tables</span><input type="number" id="tableCount" min="1" max="60" value="10" /></label>
          <button class="btn btn-green" type="button" id="genQR" data-i18n="generate">Generate</button>
          <button class="btn btn-line" type="button" id="printQR" data-i18n="printAll">Print all</button>
        </div>
        <div class="qr-grid" id="qrGrid"></div>
      </main>
    </div>

    <dialog class="sheet" id="slipDialog" aria-labelledby="slipTitle">
      <div class="sheet-inner">
        <header class="sheet-head">
          <button class="icon-btn" type="button" data-close aria-label="Close">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
          </button>
          <h2 id="slipTitle"></h2>
        </header>
        <div class="sheet-body" id="slipBody"></div>
        <footer class="sheet-foot" id="slipFoot"></footer>
      </div>
    </dialog>

    <dialog class="sheet" id="posDialog">
      <div class="sheet-inner">
        <header class="sheet-head">
          <button class="icon-btn" type="button" data-close aria-label="Close">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
          </button>
          <h2 id="posDlgTitle"></h2>
        </header>
        <div class="sheet-body" id="posDlgBody"></div>
        <footer class="sheet-foot" id="posDlgFoot"></footer>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="printArea" hidden></div>

    <script src="settings/config.js"></script>
    <script src="settings/menu.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="vendor/qrcode.js"></script>
    <script src="js/promptpay.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/pos.js"></script>
  </body>
</html>
